services:
  api:
    container_name: trans-api
    build:
      context: requirements/api/
    develop:
      watch:
        - action: sync+restart
          path: requirements/api/src
          target: app/src
        - action: rebuild
          path: requirements/api/Dockerfile
    networks:
      - transcendence
    secrets:
      - internal_ca_cert
      - api_cert
      - api_key
    environment:
      NODE_EXTRA_CA_CERTS: /run/secrets/internal_ca_cert
    restart: always

  nginx:
    container_name: trans-nginx
    build:
      context: requirements/nginx/
    develop:
      watch:
        - action: sync+restart
          path: requirements/nginx/config/nginx.conf
          target: etc/nginx/nginx.conf
        - action: rebuild
          path: requirements/nginx/Dockerfile
    networks:
      - transcendence
    volumes:
      - frontend-dist:/var/www/html
    ports:
      - "4430:443"
    depends_on:
      - frontend
    secrets:
      - ssl_crt
      - ssl_key
      - internal_ca_cert
    restart: always

  frontend:
    container_name: trans-frontend
    build:
      context: requirements/frontend
      target: ${TARGET}
    develop:
      watch:
        - action: sync
          path: requirements/frontend/src
          target: /app/src
        - action: sync
          path: requirements/frontend/public
          target: /app/dist
        - action: rebuild
          path: requirements/frontend/package.json
        - action: rebuild
          path: requirements/frontend/Dockerfile
    networks:
      - transcendence
    volumes:
      - frontend-dist:/app/dist

  pong:
    container_name: trans-pong
    build:
      context: requirements/pong/
    develop:
      watch:
        - action: sync+restart
          path: requirements/pong/src
          target: app/src
    networks:
      - transcendence
    secrets:
      - internal_ca_cert
      - pong_cert
      - pong_key
      - server_key
    environment:
      NODE_EXTRA_CA_CERTS: /run/secrets/internal_ca_cert
    restart: always

  tournament:
    container_name: trans-tournament
    build:
      context: requirements/tournament/
    develop:
      watch:
        - action: sync+restart
          path: requirements/tournament/src
          target: app/src
    networks:
      - transcendence
    secrets:
      - internal_ca_cert
      - tournament_cert
      - tournament_key
      - server_key
    environment:
      NODE_EXTRA_CA_CERTS: /run/secrets/internal_ca_cert
    restart: always

  user_handling:
      container_name: trans-user
      build:
        context: requirements/user/
      develop:
        watch:
          - action: sync+restart
            path: requirements/user/Dockerfile
            target: app/src
      networks:
        - transcendence
      secrets:
        - jwt_key
        - internal_ca_cert
        - user_cert
        - user_key
        - server_key
      environment:
        NODE_EXTRA_CA_CERTS: /run/secrets/internal_ca_cert
      restart: always

networks:
  transcendence:
    name: transcendence

volumes:
  frontend-dist:
    name: trans-frontend-dist

secrets:
  ssl_crt:
    file: ../secrets/ssl_certificate
  ssl_key:
    file: ../secrets/ssl_certificate_key
  jwt_key:
    file: ../secrets/jwt_secret_key
  internal_ca_cert:
    file: ../secrets/internal_ca_cert
  api_cert:
    file: ../secrets/api_cert
  api_key:
    file: ../secrets/api_key
  pong_cert:
    file: ../secrets/pong_cert
  pong_key:
    file: ../secrets/pong_key
  tournament_cert:
    file: ../secrets/tournament_cert
  tournament_key:
    file: ../secrets/tournament_key
  user_cert:
    file: ../secrets/user_cert
  user_key:
    file: ../secrets/user_key
  server_key:
    file: ../secrets/server_call_key
