error_log /dev/stderr;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    access_log off;  # Désactiver les access logs (ou: access_log /dev/null;)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        
        server_name localhost;

        # ssl on;
        ssl_certificate /run/secrets/ssl_crt;
        ssl_certificate_key /run/secrets/ssl_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        root /var/www/html;
        index /index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /upload/ {
            proxy_http_version 1.1;
            proxy_read_timeout 24h;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_ssl_server_name on;
            proxy_ssl_trusted_certificate /run/secrets/internal_ca_cert;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_pass https://upload:3000/;
        }

        location /pong/ {
            proxy_cache_bypass $http_upgrade;
            proxy_http_version 1.1;
            proxy_read_timeout 24h;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_ssl_server_name on;
            proxy_ssl_trusted_certificate /run/secrets/internal_ca_cert;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_pass https://pong:3001/;
        }


        location /tournament/ {
            proxy_cache_bypass $http_upgrade;
            proxy_http_version 1.1;
            proxy_read_timeout 24h;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_ssl_server_name on;
            proxy_ssl_trusted_certificate /run/secrets/internal_ca_cert;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_pass https://tournament:3002/;
        }

         location /user/ {
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
             proxy_ssl_server_name on;
             proxy_ssl_trusted_certificate /run/secrets/internal_ca_cert;
             proxy_ssl_verify on;
             proxy_ssl_verify_depth 2;
             proxy_pass https://user_handling:3003/;
         }

    }
}
