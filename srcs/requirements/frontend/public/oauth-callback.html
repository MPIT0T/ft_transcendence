<!DOCTYPE html>
<html>
<head>
    <title>GitHub OAuth Callback</title>
</head>
<body>
<script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    if (code && window.opener) {
        window.opener.postMessage({ type: 'google-auth', code }, window.origin);
        window.close();
    }
</script>
</body>
</html>
